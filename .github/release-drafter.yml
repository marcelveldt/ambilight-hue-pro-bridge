name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
change-template: "- #$NUMBER - $TITLE (@$AUTHOR)"
categories:
  - title: "⚠ Breaking Changes"
    labels:
      - "breaking-change"
  - title: "🚀 Features and enhancements"
    labels:
      - "new-feature"
      - "enhancement"
  - title: "⬆️ Dependencies"
    collapse-after: 1
    labels:
      - "dependencies"
      - "ci"
template: |
  ## What’s Changed

  $CHANGES
version-resolver:
  major:
    labels:
      - "breaking-change"
      - "refactor"
  minor:
    labels:
      - "new-feature"
      - "enhancement"
  default: patch
